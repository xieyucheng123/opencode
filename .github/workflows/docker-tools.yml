name: tools-image

# 每周一 02:00 UTC 巡检官方 v2 tag（只采用提交超 3 天的），有新 tag 才 build+push；
# 上游不会回调我们，所以 webhook 语义由 repository_dispatch 承担（外部巡检脚本或手动触发）。
on:
  schedule:
    # 每周一 02:00 UTC 巡检一次（2.x 发版频繁，不值得天天跟）
    - cron: "0 2 * * 1"
  repository_dispatch:
    types: [upstream-image]
  workflow_dispatch:
    inputs:
      base_tag:
        description: "官方镜像 tag（空则自动取最新 release）"
        required: false
        default: ""
      force:
        description: "强制重打（true/false）"
        required: false
        default: "false"

permissions:
  contents: write # 回写 .upstream-tag
  packages: write # push ghcr.io/xieyucheng123/opencode-tools

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/xieyucheng123/opencode-tools
  SWR_REGISTRY: swr.cn-north-9.myhuaweicloud.com
  SWR_IMAGE: swr.cn-north-9.myhuaweicloud.com/xieyucheng123/opencode-tools

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 以 GHCR 上的镜像 tag 为准（形如 2.0.x，无 v 前缀；git tag 另有 v 前缀，
          # 且 Releases 页是 1.x 线，都不能直接用）。
          # 滞后策略：只采用发布时间超过 3 天的 tag，避开刚发版的 hotfix churn。
          normalize() { echo "${1#v}"; }
          if [ -n "${{ inputs.base_tag }}" ]; then
            TAG="$(normalize "${{ inputs.base_tag }}")"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "${{ github.event.client_payload.tag }}" ]; then
            TAG="$(normalize "${{ github.event.client_payload.tag }}")"
          else
            CUTOFF="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
            TAG=""
            while read -r T D; do
              if [[ "${D}" < "${CUTOFF}" ]]; then TAG="${T}"; break; fi
            done < <(gh api 'orgs/anomalyco/packages/container/opencode/versions?per_page=100' \
              --jq '([.[] | {tags: .metadata.container.tags, created: .created_at} as $v | $v.tags[]? as $t | {tag: $t, created: $v.created} | select(.tag | test("^2\\.[0-9]+\\.[0-9]+$"))] | sort_by(.tag | split(".") | map(tonumber)) | reverse | .[] | "\(.tag) \(.created)")')
            if [ -z "${TAG}" ]; then echo "no tag older than 3 days."; fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "upstream tag: ${TAG}"

      - name: Skip if unchanged
        id: check
        run: |
          PREV="$(cat .upstream-tag 2>/dev/null || true)"
          FORCE="${{ inputs.force }}"
          TAG="${{ steps.upstream.outputs.tag }}"
          if [ -z "${TAG}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "no qualifying tag, skip."
          elif [ "${PREV}" = "${TAG}" ] && [ "${FORCE}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "no new upstream release (still ${PREV}), skip."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to SWR via token
        if: steps.check.outputs.skip != 'true'
        env:
          HCLOUD_AK: ${{ secrets.HCLOUD_AK }}
          HCLOUD_SK: ${{ secrets.HCLOUD_SK }}
        run: |
          mkdir -p ~/.docker
          curl -fsSL -o /tmp/hcloud.tgz "https://ap-southeast-3-hwcloudcli.obs.ap-southeast-3.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz"
          tar -xzf /tmp/hcloud.tgz -C /tmp
          echo y | /tmp/hcloud SWR CreateAuthorizationToken --cli-region=cn-north-9 --cli-access-key="$HCLOUD_AK" --cli-secret-key="$HCLOUD_SK" > /tmp/swr.json
          python3 -c "import json,os; t=json.load(open('/tmp/swr.json')); assert t.get('auths'), t; c=os.path.expanduser('~/.docker/config.json'); d=json.load(open(c)) if os.path.exists(c) else {}; d.setdefault('auths',{}).update(t['auths']); json.dump(d,open(c,'w')); print('swr auth merged')"

      - name: Login to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.tools
          push: true
          build-args: |
            BASE_TAG=${{ steps.upstream.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.upstream.outputs.tag }}
            ${{ env.IMAGE }}:latest
            ${{ env.SWR_IMAGE }}:${{ steps.upstream.outputs.tag }}
            ${{ env.SWR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record upstream tag
        if: steps.check.outputs.skip != 'true'
        run: |
          echo -n "${{ steps.upstream.outputs.tag }}" > .upstream-tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .upstream-tag
          git diff --staged --quiet || git commit -m "chore: track upstream ${{ steps.upstream.outputs.tag }}"
          git push
